<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Проверка отображения · Версия 1</title><style>body{margin:0;background:#dfe3d9;font:14px Arial;color:#26372e}header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:15px 20px;background:#f4f1e9;position:sticky;top:0;z-index:2;border-bottom:1px solid #26372e33}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:7px}main{padding:20px;overflow:auto}iframe{display:block;background:#f4f1e9;border:0;box-shadow:0 10px 40px #26372e33}p{margin:0;font-size:12px}strong{font-weight:500}</style></head><body><header><strong>Проверка отображения · Версия 1</strong><label>Экран<select id="viewport"><option value="390x844">Телефон · 390 × 844</option><option value="375x812">Телефон · 375 × 812</option><option value="320x740">Телефон · 320 × 740</option><option value="768x1024">Планшет · 768 × 1024</option><option value="1360x900">Компьютер · 1360 × 900</option><option value="1920x1080">Экран · 1920 × 1080</option></select></label><label>Сцена<select id="scene"><option value="s01">01 · Титульный экран</option><option value="s02">02 · Почему ЛПНП высокий?</option><option value="s03">03 · Липидный профиль</option><option value="s04">04 · Качество жиров</option><option value="s05">05 · Замена продуктов</option><option value="s06">06 · Клетчатка</option><option value="s07">07 · Белок</option><option value="s08">08 · Повседневный рацион</option><option value="s09">09 · Этикетка</option><option value="s10">10 · Личный риск</option><option value="s11">11 · Питание и лечение</option><option value="s12">12 · Вопросы врачу</option><option value="s13">13 · Привычка</option><option value="s14">14 · Финал</option></select></label><p>Встроенный экран использует собственный viewport.</p></header><main><iframe id="screen" title="Лекция VERBA · Версия 1" width="390" height="844" src="./#s01"></iframe></main><script>const screen=document.querySelector('#screen'),viewport=document.querySelector('#viewport'),scene=document.querySelector('#scene');const qs=new URLSearchParams(location.search);if(qs.has('viewport'))viewport.value=qs.get('viewport');if(qs.has('scene'))scene.value=qs.get('scene');function size(){const[w,h]=viewport.value.split('x');screen.width=w;screen.height=h;}const revision=Date.now().toString();function show(){screen.src='./?qa='+revision+'#'+scene.value;}viewport.addEventListener('change',size);scene.addEventListener('change',show);size();show();</script></body></html>
